# mediamtx config for webcam-jetson
# Source of truth: skills/webcam-jetson/server/mediamtx.yml
# Installed to: /etc/webcam-jetson/mediamtx.yml

logLevel: info
logDestinations: [stdout]

# RTSP server
rtsp: yes
rtspAddress: :8554
rtspTransports: [tcp, udp]
protocols: [tcp, udp]

# HLS server (browser-friendly)
hls: yes
hlsAddress: :8888
hlsAllowOrigin: '*'
hlsAlwaysRemux: no
hlsVariant: lowLatency
hlsSegmentCount: 7
hlsSegmentDuration: 1s
hlsPartDuration: 200ms

# WebRTC requires H.264 — disabled because we publish MJPEG.
# Re-enable and add a transcoded path if needed.
webrtc: no

# RTMP not needed
rtmp: no
srt: no

# Local-only API (used by webcam_server.py /healthz)
api: yes
apiAddress: 127.0.0.1:9997

# Disable Prometheus / pprof unless wanted
metrics: no
pprof: no

# Auto-publish from /dev/video0 via ffmpeg (MJPEG passthrough — low CPU)
paths:
  cam:
    source: publisher
    sourceProtocol: tcp
    # Capture loop: re-run forever if ffmpeg exits (device unplugged, etc).
    runOnInit: >
      ffmpeg -hide_banner -loglevel warning
      -f v4l2 -input_format mjpeg -video_size 1280x720 -framerate 30
      -i /dev/video0
      -c copy -f rtsp -rtsp_transport tcp
      rtsp://127.0.0.1:$RTSP_PORT/cam
    runOnInitRestart: yes
