name: secret-argv-lint

# API キーを curl の argv に載せる書き方を PR で機械検証する (Issue #40)。
# 人間の注意では再発を止められないため CI で落とす (model-drift.yml と同じ思想)。
on:
  pull_request:
    paths:
      - "skills/**"
      - "scripts/**"
      - "templates/**"
      - "agents/**"
      - "plugins/**"
      - "prompts/**"
      - ".github/**"
      - "CLAUDE.md"
      - "RULES.md"
      - "AGENTS.md"
  push:
    branches: [main]

jobs:
  secret-argv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: API キーの argv 露出検査 (Issue #40)
        run: bash scripts/lint-secret-argv.sh
