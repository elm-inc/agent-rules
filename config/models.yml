    status: active_upstream
  - id: gemini-2.5-pro
    vendor: gemini
    retires_on: 2026-10-16
    successor: gemini-3.1-pro-preview
    status: deprecated  # まだ生きているが期限あり
  - id: claude-opus-4-8
    vendor: anthropic
    successor: claude-opus-5
    status: active_upstream  # 上流では現役。本リポの既定から外しただけ
  - id: claude-fable-5
    vendor: anthropic
    successor: claude-fable-5-1
    status: active_upstream  # 上流では現役。`model: "fable"` が 5.1 を指すため既定から外した
  - id: RedHatAI/Qwen2.5-Coder-32B-Instruct-FP8-dynamic
    vendor: huggingface
    successor: cyankiwi/Qwen3-Coder-30B-A3B-Instruct-AWQ-4bit
