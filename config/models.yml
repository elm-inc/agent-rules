# --- 疎通確認の宛先 -------------------------------------------------------
probes:
  anthropic:
    url: https://api.anthropic.com/v1/models
    token_file: ~/.anthropic_token
    auth: "x-api-key"
    extra_header: "anthropic-version: 2023-06-01"
    jq_ids: '.data[].id'
  deepseek:
    url: https://api.deepseek.com/v1/models
    token_file: ~/.deepseek_token
    auth: bearer
    jq_ids: '.data[].id'
  gemini:
    url: "https://generativelanguage.googleapis.com/v1beta/models"
    token_file: ~/.gemini_token
    auth: query_key
    jq_ids: '.models[].name | sub("^models/";"")'
  openai:
    url: https://api.openai.com/v1/models
    token_file: ~/.openai_token
    auth: bearer
    jq_ids: '.data[].id'
  huggingface:
    url: https://huggingface.co/api/models/
    token_file: ~/.hf_token
    auth: bearer_optional
    jq_ids: '.id'
