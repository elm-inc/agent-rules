# モデル台帳 — スキル/スクリプトが使うモデル ID の単一ソース (根拠: ADR-0017)
#
# なぜ台帳が要るか:
#   2026-07-24 に deepseek-reasoner (R1) が退役したが、モデル ID が
#   skills/deepseek-redteam/SKILL.md に直接埋まっていたため 3 週間検知できなかった。
#   「ベンダーは黙ってモデルを消す」を前提に、ID を一箇所に集めて機械検証する。
#
# 運用:
#   - モデルを足す/変えるときは必ずここを先に直す
#   - `bash scripts/model-doctor.sh` … ベンダー API に実在確認 + 台帳との drift 検査
#   - CI (model-drift.yml) は API キー不要の drift 検査のみ実行する
#   - `retired:` は「かつて使っていた ID」。docs/adr の履歴記述と突き合わせるための記録で、
#     operational surface (skills/ scripts/ CLAUDE.md) に現れたら CI が落とす
#
# probe の限界 (2026-09-20 に実測で判明):
#   --probe は `/v1/models` の一覧と照合する。**一覧に無い = 使えない、ではない。**
#   deepseek-v4-flash は一覧から消えた後も実呼び出しでは応答した (未掲載のまま生存)。
#   「存在しません」が出たら、退役と決めつける前に実際に 1 回呼んで確かめること。
#   逆方向の穴もある: 一覧にあっても権限が無ければ 403 になる (プラン差)。
#
# 四半期見直し: 次回 2026-11

updated: 2026-09-20

# --- 稼働中のモデル -------------------------------------------------------
active:
  # 司令塔・実装 (Claude Code のセッションモデル)
  - key: session
    vendor: anthropic
    id: claude-opus-5
    layer: 司令塔
    note: "$5/$25 per MTok。Opus 4.8 と同価格で step-change。1M ctx"

  # 最後の砦 (高リスク変更のみ・subagent 委譲)
  - key: escalation
    vendor: anthropic
    id: claude-fable-5-1
    layer: 最後の砦
    note: >-
      $10/$50 per MTok = Opus 5 の 2 倍 (Fable 5 と同額)。cache read $0.25/MTok。
      ADR-0019 のフロンティア枠課金規律が適用される。
      **Agent tool の `model: "fable"` エイリアスは既に本 ID に解決される** (2026-09-06 に
      subagent 自己申告で確認)。スキル側は引き続きエイリアスを使うため ID 直書きはしないが、
      「実際に何が走っているか」を台帳に記録する意味でここに置く。
      Fable 5 からの破壊的変更: forced tool_choice (any/tool) が 400 /
      thinking block が生成モデルに束縛される / 履歴編集で thinking が無効化される (append-only 必須)。

  # 探索・調査サブエージェントの床
  - key: explorer
    vendor: anthropic
    id: claude-haiku-4-5
    # id は alias。呼び出しには使えるが /v1/models には dated ID で載るため、
    # 疎通確認だけ upstream_id を見る (alias と実体の対応をここに記録する意味もある)。
    upstream_id: claude-haiku-4-5-20251001
    layer: 床
    note: "$1/$5 per MTok。agents/explorer.md agents/researcher.md が使用"

  # 重い探索・並列ワーカー (near-Opus @ Sonnet 価格)
  - key: worker
    vendor: anthropic
    id: claude-sonnet-5
    layer: 床
    note: "$3/$15 per MTok (導入価格 $2/$10 は 2026-08-31 まで)。広いファンアウト用"

  # 0 次レビュー / テスト実装 (ローカル・0 円・機密 OK)
  - key: local
    vendor: huggingface
    id: cyankiwi/Qwen3-Coder-30B-A3B-Instruct-AWQ-4bit
    # commit pin (必須): 発行元が公式 org ではないため、org 単位ではなく
    # 「この 1 コミットだけ」を信頼する。vllm-verify-model.sh がこれを検証する。
    revision: 4bd30395b72ea6045edd04806c4fea448d4467b3
    layer: 床
    served_as: qwen-coder
    note: >-
      MoE (total 30B / active 3B)。2026-08-17 に本機 (RTX PRO 4500 32GB / vLLM 0.21.0) で実測:
      重み 16.91 GiB・KV cache 92,560 tok・199 tok/s。
      旧 RedHatAI/Qwen2.5-Coder-32B-FP8 は重み約 30GB で offload 6GB を強いられ 6 tok/s・
      max_model_len 4096 が律速だった (ADR-0001 の積み残し) → 速度 33 倍・context 22 倍。
      NVIDIA 公式の NVFP4 版 (35B-A3B / 27B) は同環境で両方 OOM したため不採用 (ADR-0017)。

  # 日本語の記述生成 (評価中・ai-trading-platform の企業分析用)
  #
  # **なぜ足すか**: 既定の `local` は coder モデルで、日本語の散文を書かせると
  # 中国語が混ざる。ai-trading-platform で全社 3,718 社を生成したとき
  # **22.3% (829 社)** に `84130百万元` (通貨の取り違え) や `東京证券交易所`
  # (簡体字) が出た。プロンプトで抑え込めたが、モデル側の適性を比べるために登録する。
  - key: local-ja-general
    vendor: huggingface
    id: cyankiwi/Qwen3.6-27B-AWQ-INT4
    # commit pin (必須): 公式 org ではないため「この 1 コミットだけ」を信頼する
    revision: e5cc0400fb2403c437c2c40a7c52fb5ae93fda18
    layer: 床
    served_as: qwen-27b
    note: >-
      汎用 (coder ではない) Qwen3.6 27B の AWQ INT4。
      **本機では使えない**: 2026-09-22 実測で重みが VRAM 28GB を占め OOM
      (max_len を 8192 に落としても KV cache が確保できない)。
      27B クラスが 32GB に載らないのは NVFP4 版と同じ (ADR-0017 の記録と一致)。

  - key: local-ja-native
    vendor: huggingface
    id: tokyotech-llm/Llama-3.1-Swallow-8B-Instruct-v0.3
    revision: 0858f50ecfbc61eab25f353013e0be542e1312ac
    layer: 床
    served_as: swallow-8b
    note: >-
      日本語継続事前学習 (Llama-3.1 ベース)。fp16 約 16GB / max_position_embeddings=8192。
      2026-09-22 実測 (同一 40 社): 中国語混入 0 / 材料の誤読 0 / 5.9 秒per社 / 340 字。
      **日本語特化は有効だが必須ではない** — 英語主体の gemma-3-12b が
      同じく汚染 0・誤読 0 でより詳しい (414 字) 記述を出した。

  # 日本語の記述生成で最良 (2026-09-22 実測)
  - key: local-ja-best
    vendor: huggingface
    id: RedHatAI/gemma-3-12b-it-FP8-dynamic
    # RedHatAI は許可 org なので pin は必須ではないが、実測と対応づけるため記録する
    revision: 15180966d5519f0bbd815362db005dc67bb2332f
    layer: 床
    served_as: gemma-12b
    note: >-
      Gemma 3 12B の FP8。重み約 13GB / VRAM 29GB で安定。
      2026-09-22 実測 (同一 40 社・同一プロンプト): **中国語混入 0 / 材料の誤読 0 /
      材料外の数字 0** で 6.5 秒per社・414 字。4 候補中で最良。
      比較対象: qwen-coder は 60% 汚染 (每×19/元×5)、
      ministral-8b は「法人番号指定日」を「設立日」と 48% で誤読した。

  # 設計レッドチーム (異ベンダー・思考連鎖)
  - key: redteam
    vendor: deepseek
    id: deepseek-v4-pro
    layer: 多様性
    params: '{"thinking":{"type":"enabled"},"reasoning_effort":"high"}'
    response_field: choices[0].message.reasoning_content
    note: "DeepSeek-V4-Pro-0813。R1 の後継。思考は reasoning_content に入る (2026-08-17 実呼び出しで確認)"

  # テスト観点の多面出し (安価・大量)
  - key: brainstorm
    vendor: deepseek
    id: deepseek-flash
    layer: 多様性
    params: '{"thinking":{"type":"enabled"},"reasoning_effort":"high"}'
    note: >-
      V4-Pro より 1 桁安い。観点の拡散用。
      **2026-09-20 に deepseek-v4-flash から改名** (上流の `/v1/models` は
      deepseek-flash / deepseek-v4-pro の 2 つのみ)。同日、本機から実呼び出しで
      上記 params が通ることを確認 (reasoning_tokens が返る)。
      旧 ID `deepseek-v4-flash` は**一覧から消えた後も応答する**ため、
      probe の「存在しません」だけで退役と判断しない (ヘッダの probe の限界を参照)

  # リポ横断レビュー (長文コンテキスト)
  - key: crossfile
    vendor: gemini
    id: gemini-3.1-pro-preview
    layer: 多様性
    note: >-
      入力 1,048,576 tok / 出力 65,536 tok (API 実測)。thinking 既定 ON で
      1 tok の応答にも 100+ thinking tok を消費するため maxOutputTokens は潤沢に。
      gemini-2.5-pro は 2026-10-16 退役予定。
      2026-09-20 の上流一覧では 3.5〜3.8 は flash 系のみで、**pro 系は 3.1 が最新**。
      据え置きでよい (次の四半期見直しで再確認)

  # セカンドオピニオン (異ベンダー・実装視点)
  - key: secondopinion
    vendor: openai
    id: null
    managed_by: codex-cli
    layer: 多様性
    note: >-
      Codex CLI が既定モデルを管理するため ID を固定しない (2026-07-09 以降の既定は
      GPT-5.6 Sol)。スキル側も `codex review` / `codex exec` を呼ぶだけで --model を渡さない。
      高リスク差分で明示的に上位を使う場合のみ `--model gpt-6-astra` (下の frontier_diversity)

  # 多様性層のフロンティア級 (高リスク変更時のみ・異ベンダー独立視点)
  - key: frontier_diversity
    vendor: openai
    id: gpt-6-astra
    layer: 多様性
    note: >-
      GPT-6 Astra (2026-09-03 公開)。$10/$50 per MTok = Fable 5.1 と同額・Opus 5 の 2 倍。
      cache read $1/MTok。**入力 272K 超で input 2x / output 1.5x** になるため
      リポ横断 (1M context) 用途では Gemini より高い — 横断は `/gemini-review` に残す。
      context 1,050,000 tok / 出力 128,000 tok。
      2026-09-06 に本機から実測確認: reasoning.effort は low|medium|high|xhigh|max のみ
      (`none` は 400)、temperature/top_p は非サポート (400)、Chat Completions と
      Responses の両方に応答する。
      **Codex CLI 0.153.4 以上が必要** — 0.149.1 は server-side で 400
      ("requires a newer version of Codex") を返す。根拠: ADR-0019

  # 画像生成・編集 (テキスト→画像 / 参照画像+指示→画像)
  - key: image
    vendor: gemini
    id: gemini-3.1-flash-image
    layer: 画像生成
    note: >-
      API displayName は "Nano Banana 2"。generateContent で生成と編集の両方を扱い、
      画像は inlineData に base64 で返る。skills/nano-banana が既定で使用。
      -preview 版も併存するが GA 版を採る (2026-08-28 に /v1beta/models で実在確認)

  # 画像生成・編集 (高品質・文字描画に強い上位)
  - key: image_pro
    vendor: gemini
    id: gemini-3-pro-image
    layer: 画像生成
    note: >-
      API displayName は "Nano Banana Pro"。/nano-banana --pro で選択。
      文字を含む図版や納品物向け。初代 gemini-2.5-flash-image ("Nano Banana") は
      本リポでは未使用

# --- 退役・移行済み -------------------------------------------------------
