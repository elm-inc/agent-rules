  - id: deepseek-reasoner
    vendor: deepseek
    retired_on: 2026-07-24
    successor: deepseek-v4-pro
  - id: deepseek-chat
    vendor: deepseek
    retired_on: 2026-07-24
    successor: deepseek-flash
  - id: deepseek-v4-flash
    vendor: deepseek
    successor: deepseek-flash
    # 上流の /v1/models からは 2026-09-20 までに消えたが、実呼び出しでは応答する
